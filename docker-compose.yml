services:
  db: 
    image: pgvector/pgvector:pg16 
    container_name: medical-rag-db-v2 
    restart: unless-stopped
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medical_rag_v2
    ports:
      - "5433:5432"
    volumes:
      - medical_rag_pgdata_v2:/var/lib/postgresql/data
    healthcheck:

      test: [ "CMD-SHELL", "pg_isready -U raguser -d medical_rag_v2" ]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  medical_rag_pgdata_v2: